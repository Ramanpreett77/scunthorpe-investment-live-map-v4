name: Blog draft (approval queue)

# Saturday evening: writes next week's article as a DRAFT for a rotating
# audience persona, and opens an issue for your approval. NOTHING is published
# until you add the "approved" label (which triggers "Auto Blog Publisher").
#
# Manual test: Actions tab -> "Blog draft (approval queue)" -> Run workflow.
#   * topic box blank  = best-fit topic for this week's persona
#   * persona box blank = this week's persona in the rotation

on:
  schedule:
    - cron: "0 18 * * SAT" # Sat 18:00 UTC (19:00 UK during BST) - new draft
    - cron: "0 7 * * MON" # Mon 07:00 UTC - reminder only if still unapproved
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic slug (blank = best fit for the persona)"
        required: false
        default: ""
      persona:
        description: "Optional persona id (blank = this week's rotation)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-draft
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * SAT'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Pick publish date + persona + topic
        id: pick
        env:
          TOPIC_IN: ${{ inputs.topic }}
          PERSONA_IN: ${{ inputs.persona }}
        run: |
          set -euo pipefail
          DATE=$(python3 bot/draft_flow.py --next-monday)
          PERSONA="$PERSONA_IN"
          if [ -z "$PERSONA" ]; then
            PERSONA=$(python3 bot/personas.py --for-week | awk '{print $1}')
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "persona=$PERSONA" >> "$GITHUB_OUTPUT"
          echo "topic=$TOPIC_IN" >> "$GITHUB_OUTPUT"
          echo "Drafting for persona '$PERSONA' ($DATE)"

      - name: Generate draft (persona-aware, AI with template fallback)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_REGION: "Scunthorpe & North Lincolnshire"
        run: |
          set -euo pipefail
          cd bot
          TOPIC_ARG=""
          if [ -n "${{ steps.pick.outputs.topic }}" ]; then
            TOPIC_ARG="--topic ${{ steps.pick.outputs.topic }}"
          fi
          python3 persona_writer.py --ai \
            --persona "${{ steps.pick.outputs.persona }}" \
            $TOPIC_ARG \
            --date "${{ steps.pick.outputs.date }}" \
            --out _drafts \
            --site-url "${{ vars.SITE_URL || 'https://ramanpreett77.github.io/scunthorpe-investment-live-map-v4/blog' }}"
          SLUG=$(python3 -c "import json;print(json.load(open('output/latest.json'))['slug'])")
          cp output/latest.json "_drafts/${{ steps.pick.outputs.date }}-${SLUG}.meta.json"

      - name: Commit draft (not published - drafts live outside _posts)
        run: |
          set -euo pipefail
          git config user.name "draft-bot"
          git config user.email "draft-bot@users.noreply.github.com"
          git add bot/_drafts
          if git diff --cached --quiet; then
            echo "No draft changes to commit"
          else
            git commit -m "Draft: ${{ steps.pick.outputs.persona }} for ${{ steps.pick.outputs.date }} (awaiting approval)"
            git push
          fi

      - name: Open approval issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SLUG=$(python3 -c "import json;print(json.load(open('bot/output/latest.json'))['slug'])")
          DRAFT="bot/_drafts/${{ steps.pick.outputs.date }}-${SLUG}.md"
          META="bot/_drafts/${{ steps.pick.outputs.date }}-${SLUG}.meta.json"
          TITLE=$(python3 bot/draft_flow.py --title "$DRAFT")

          # audience / focus / closing question, straight from the draft's metadata
          readarray -t LINES < <(python3 - "$META" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          p = m.get("persona", {}) or {}
          print("**Audience:** " + (p.get("audience") or "(general)"))
          print("**Focus:** " + (p.get("focus") or "-"))
          print("**Closing question:** " + (p.get("question") or "-"))
          print("**Engine:** " + (m.get("engine") or "-"))
          PY
          )

          gh label create approval-needed --color FBCA04 --description "Draft waiting for your approval" > /dev/null 2>&1 || true
          gh label create approved --color 0E8A16 --description "Approve: publish this draft" > /dev/null 2>&1 || true
          gh label create skip --color 6E7781 --description "Skip: discard this draft" > /dev/null 2>&1 || true
          gh label create published --color 5319E7 --description "Published" > /dev/null 2>&1 || true
          gh label create superseded --color D4C5F9 --description "Replaced by a newer draft" > /dev/null 2>&1 || true

          # Close any older draft still waiting for a decision
          for n in $(gh issue list --label approval-needed --state open --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue comment "$n" --body "Superseded by a newer draft - nothing was published from this one." || true
            gh issue edit "$n" --remove-label approval-needed --add-label superseded || true
            gh issue close "$n" || true
          done

          {
            echo "## Draft ready for your approval"
            echo ""
            echo "**Article:** $TITLE"
            echo ""
            echo "**Planned publish date:** ${{ steps.pick.outputs.date }}"
            echo ""
            for l in "${LINES[@]}"; do echo "$l"; echo ""; done
            echo "**Edit the draft:** [bot/_drafts/${{ steps.pick.outputs.date }}-${SLUG}.md](https://github.com/${{ github.repository }}/blob/main/$DRAFT) - click the pencil, edit, commit. Your edited version is what gets published."
            echo ""
            echo "---"
            echo ""
            echo "### To publish"
            echo "Add the label **approved** to this issue (right-hand sidebar -> Labels). Publishing starts within a minute: LinkedIn native post (link in the first comment), blog article, Facebook/Instagram where configured."
            echo ""
            echo "### To skip"
            echo "Add the label **skip**, or comment \`/skip\`. Nothing is published."
            echo ""
            echo "---"
            echo ""
            echo "<details><summary><b>Read the full draft here</b></summary>"
            echo ""
            cat "$DRAFT"
            echo ""
            echo "</details>"
            echo ""
            echo "_Nothing is published until you approve. You can approve from the GitHub mobile app too._"
            echo ""
            echo "<!-- DRAFT_PATH: $DRAFT -->"
          } > /tmp/issue.md

          gh issue create \
            --title "Approval needed: $TITLE" \
            --label approval-needed \
            --body-file /tmp/issue.md

  remind:
    if: github.event.schedule == '0 7 * * MON'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nudge about the pending draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUES=$(gh issue list --label approval-needed --state open --json number --jq '.[].number' 2>/dev/null || true)
          if [ -z "$ISSUES" ]; then
            echo "No draft waiting for approval - nothing to remind about."
            exit 0
          fi
          for n in $ISSUES; do
            gh issue comment "$n" --body "Reminder: this draft is still waiting for your decision. Add the **approved** label to publish it, or **skip** to discard it. Nothing publishes until you choose."
          done
