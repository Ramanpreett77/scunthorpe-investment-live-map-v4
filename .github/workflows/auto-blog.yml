name: Auto Blog Publisher

# SGJM autopilot: every Monday 07:00 UTC - new article -> site rebuild -> social posts.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * MON"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Generate article
        run: cd bot && python3 blog_generator.py --site-url "${{ vars.SITE_URL || 'https://ramanpreett77.github.io/scunthorpe-investment-live-map-v4/blog' }}"
        env:
          BLOG_REGION: "Scunthorpe & the West Midlands"

      - name: Build carousel slides
        run: cd bot && python3 carousel_builder.py --url-prefix "${{ vars.SITE_URL || 'https://ramanpreett77.github.io/scunthorpe-investment-live-map-v4/blog' }}/assets/slides/"

      - name: Build static website
        run: cd bot && python3 build_site.py --out ../blog --site-url "${{ vars.SITE_URL || 'https://ramanpreett77.github.io/scunthorpe-investment-live-map-v4/blog' }}"

      - name: Commit to GitHub Pages
        run: |
          git config user.name "SGJM Blog Bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/_posts bot/output/slides blog
          if ! git diff --cached --quiet; then
            git commit -m "SGJM: new article + site rebuild [auto]"
            git push
          else
            echo "Nothing new to commit."
          fi

      - name: Publish carousels to social media (skips platforms without credentials)
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: cd bot && python3 social_media_poster.py --platforms all --carousel --post

      - name: Reply to new comments
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: cd bot && python3 engagement_bot.py --platforms all --post
