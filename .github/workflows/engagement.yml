name: Engagement Bot

# Replies to new comments on your posts.
#
# DELIBERATE DEFAULT: LinkedIn replies are OFF. For the first few months a reply
# that reads like you beats an automated one - so this bot covers Facebook (and
# Instagram via the Facebook token) only, and you answer LinkedIn yourself.
# To let it reply on LinkedIn too, run it manually with platforms = linkedin
# (or facebook,instagram,linkedin).

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to reply on (linkedin,facebook,instagram)"
        required: false
        default: "facebook,instagram"
  schedule:
    - cron: "0 9,17 * * *"

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Restore replied-comment state
        uses: actions/cache@v4
        with:
          path: bot/output/replied_comments.json
          key: replied-comments
      - name: Reply to new comments
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLATFORMS: ${{ inputs.platforms || 'facebook,instagram' }}
        run: |
          cd bot
          python3 engagement_bot.py --platforms "$PLATFORMS" --post
